[project]
name = "lavishcars-marketplace-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic[email]>=2.10,<3",
  "python-multipart>=0.0.20",
  "Pillow>=11,<13",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<1"]

[tool.vercel]
entrypoint = "app.main:app"
