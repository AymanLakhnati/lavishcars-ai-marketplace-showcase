name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: DATABASE_URL=sqlite:///./migration-check.db alembic upgrade head
      - run: DATABASE_URL=sqlite:///./migration-check.db alembic check

  web-and-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lavish
          POSTGRES_PASSWORD: lavish_local_only
          POSTGRES_DB: lavish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lavish -d lavish"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://lavish:lavish_local_only@127.0.0.1:5432/lavish
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: node apps/web/tests/proxy-contract.mjs
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
      - name: Migrate, seed, and start API
        shell: bash
        run: |
          cd services/api
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../api.log 2>&1 &
      - name: Start storefront
        shell: bash
        run: npm --prefix apps/web start > web.log 2>&1 &
      - name: Wait for services
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log web.log
          exit 1
      - run: npx playwright test
      - run: node apps/web/tests/feature-smoke.mjs
        env:
          TEST_API_URL: http://127.0.0.1:8000/api/v1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
