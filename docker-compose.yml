services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lavish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lavish_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-lavish}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./services/api
      dockerfile: ../../infra/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lavish:lavish_local_only@db:5432/lavish}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoDrive!2026}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      API_INTERNAL_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  uploads:
